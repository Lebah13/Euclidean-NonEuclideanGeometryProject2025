name: Build hyperbolic tiling image

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install matplotlib

      - name: Run tiling script (CI mode)
        run: |
          python hyperbolic_tiling.py

      - name: Upload tiling image
        uses: actions/upload-artifact@v4
        with:
          name: hyperbolic-tiling
          path: tiling.png
